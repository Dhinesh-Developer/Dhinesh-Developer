    <text x="90" y="112" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">of Fame</text>
    <text x="90" y="126" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">KIOT · CGPA 8.5</text>
