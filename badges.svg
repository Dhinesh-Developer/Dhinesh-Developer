  <!-- Badge 3 -->
  <g transform="translate(422,75)">
    <rect x="0" y="0" width="180" height="140" rx="16" fill="#161b22" stroke="url(#border)" stroke-width="2"/>
    <circle cx="90" cy="45" r="26" fill="none" stroke="url(#border)" stroke-width="3"/>
    <text x="90" y="53" text-anchor="middle" font-size="22">🔥</text>
