<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="border2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="20" font-weight="700" fill="#ffffff">🏆 Achievements &amp; Milestones</text>
  <text x="500" y="54" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#9ca3af">DhineshKumar M · Full Stack Java Developer</text>

  <!-- Badge 1 -->
  <g transform="translate(30,75)">
    <rect x="0" y="0" width="180" height="140" rx="16" fill="#161b22" stroke="url(#border)" stroke-width="2"/>
    <circle cx="90" cy="45" r="26" fill="none" stroke="url(#border)" stroke-width="3"/>
    <text x="90" y="53" text-anchor="middle" font-size="22">🧩</text>
    <text x="90" y="92" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="17" font-weight="700" fill="#A78BFA">1000+</text>
    <text x="90" y="112" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">DSA Problems</text>
    <text x="90" y="126" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">Solved</text>
  </g>

  <!-- Badge 2 -->
  <g transform="translate(226,75)">
    <rect x="0" y="0" width="180" height="140" rx="16" fill="#161b22" stroke="url(#border2)" stroke-width="2"/>
    <circle cx="90" cy="45" r="26" fill="none" stroke="url(#border2)" stroke-width="3"/>
    <text x="90" y="53" text-anchor="middle" font-size="22">⚡</text>
    <text x="90" y="92" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="17" font-weight="700" fill="#06B6D4">1400+</text>
    <text x="90" y="112" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">LeetCode Contest</text>
    <text x="90" y="126" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#d1d5db">Rating</text>
